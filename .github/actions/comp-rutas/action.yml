name: 'Comprobar Archivos necesarios del repositorio'
description: 'Verifica la existencia de los archvos app.js, index.php, styles.css e index.html'

inputs: 
  rutas:
    description: 'Archivos del repo a comprobar'
    required: true
  
runs: 
  using: 'composite'
  steps: 
    - name: Comprobación de archivos
      shell: bash
      run: | 
        for archivo in ${{ inputs.rutas }}; do
          if [ -f "$archivo" ]; then
            echo "$archivo, esta en el repo"
          else 
            echo "$archivo, no esta en la ruta"
            exit 1
          fi
        done
