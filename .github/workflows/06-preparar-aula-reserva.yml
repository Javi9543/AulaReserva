name: 06 - Preparacion de AulaReserva

on:
  workflow_dispatch:
    branches: 
      - develop
      - 'feature/**'

jobs:
  preparacion:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: generar front/config.js 
        run: |
          echo "window.APP_CONFIG = {" > frontend/config.js"}
          echo "  appName: '${{ vars.APP_NAME }}'," >> frontend/config.js
          echo "  env: '${{ vars.APP_ENV }}'" >> frontend/config.js
          echo "} ;" >> frontend/config.js
      
      - name: carpeta dist 
        run: mkdir dist
    
      - name: copiar carpetas a dist
        run: cp -r frontend backend database dist/

      - name: subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ vars.APP_NAME }}-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
