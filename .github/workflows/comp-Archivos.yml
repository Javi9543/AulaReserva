name: Comprobar Archivos del repo

on:
  push:
    branches: 
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - develop
  workflow_dispatch:

jobs:
  validar: 
    runs-on: ubuntu-latest

    steps: 
      - uses: actions/checkout@v7
      - name: uso de action para comprobar las rutas
        id: comprobacion
        uses: ./.github/actions/comp-rutas
        with: 
          rutas: backend/public/index.php frontend/css/styles.css frontend/js/app.js frontend/index.html