<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Javier Muñoz Parra">
    <link rel="stylesheet" href="./css/styles.css">
    <title>Reservar Aula/s</title>
</head>
<body>
    <!-- Formulario de reserva de aulas -->
    <form id="formulario-reserva">
        <fieldset>
            <legend>Reservar Aula</legend>
            <fieldset>
                <select name="aula" id="aula">
                    <option value="">Seleccione un aula a reservar</option>
                </select>
        
                <br><br>
                <label for="fecha">Fecha de reserva</label>
                <input type="date" name="fecha" id="fecha"> <br><br>
        
                <label for="hora">¿A que hora quieres reservar?</label>
                <input type="time" id="hora" name="hora"> <br><br>
        
                <label for="usuario">¿Quien eres?</label>
                <input type="text" name="usuario" id="usuario" placeholder="Introduzca su nombre"> <br><br>
                
                
            </fieldset>
            <br>
            <fieldset>
                <button type="submit">¡Reservar Aula!</button>
                <button type="reset">Resetear Formulario</button>
            </fieldset>
        </fieldset>
    </form>
    
    <!-- por si existe algun error -->
    <p id="mensaje"></p>
    <!-- Enlace al archivo JS -->
    <script src="./js/app.js"></script>
</body>
</html>
